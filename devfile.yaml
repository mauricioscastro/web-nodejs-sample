schemaVersion: 2.2.0
metadata:
  name: test-script-devfile
components:
  - name: tools
    container:
      #image: quay.io/mauriciosantiagodecastro/devspaces-test-copy
      #image: quay.io/mauriciosantiagodecastro/udi-test:0.0.1
      image: quay.io/mauriciosantiagodecastro/udi-test:0.0.2
      securityContext:
        capabilities:
          add:
            - SETUID
            - SETGID
            - SYS_CHROOT
      command: ['tail', '-f', '/dev/null']
      # env:
      # memoryLimit: 512Mi
      # mountSources: true
      # - name: KUBEDOCK_ENABLED
      #   value: "true"
commands:
  - id: run-test-script
    exec:
      component: tools
      commandLine: 'echo "Creating and running test script..." && echo "Hello from Eclipse Che!" > run_test.sh && chmod +x run_test.sh && ./run_test.sh'
      workingDir: '${PROJECTS_ROOT}'

